name: lora_fp16
base_model: mistralai/Mistral-7B-Instruct-v0.3
quantization: null          # FP16, no quantization

lora:
  r: 16
  lora_alpha: 16
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  lora_dropout: 0.05
  bias: none

load_in_4bit: false
torch_dtype: float16
device_map: auto
gradient_checkpointing: true
optim: paged_adamw_32bit
