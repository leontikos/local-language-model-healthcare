name: lora_fp16
base_model: mistralai/Mistral-7B-Instruct-v0.3
quantization: null          # FP16, no quantization

lora:
  r: 16
  lora_alpha: 32   # 2×r — standard scaling
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  lora_dropout: 0.05
  bias: none

load_in_4bit: false
torch_dtype: float16
device_map: auto
gradient_checkpointing: false   # A100 40GB — no need
optim: adamw_torch
